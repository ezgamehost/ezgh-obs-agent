apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if include "agent.apiAccess" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agent.clusterRoleName" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
rules:
  {{- if and .Values.metrics.enabled .Values.metrics.collectKubeletMetrics }}
  - apiGroups: [""]
    resources: [nodes/stats]
    verbs: [get]
  {{- end }}
  {{- if include "agent.podSpecs" . }}
  # The kubelet's /pods (pod specs: requests, limits, volumes), Kubernetes 1.33+. Never nodes/proxy.
  - apiGroups: [""]
    resources: [nodes/pods]
    verbs: [get]
  {{- end }}
  {{- if include "agent.k8sMetadata" . }}
  # Pod metadata and owners (ReplicaSet → Deployment, Job → CronJob); read-only.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agent.clusterRoleName" . }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agent.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent.name" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
