# No host log access, Kubernetes token, or cluster RBAC (and so no cluster state or events).
# The export queue still uses hostPath.
cluster:
  name: production-us-west
ezgh:
  environment: production
auth:
  existingSecret: ezgh-obs-ingest
logs:
  collectContainerLogs: false
metrics:
  collectKubeletMetrics: false
clusterState:
  enabled: false
