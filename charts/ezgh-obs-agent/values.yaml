# Required. Keep the name stable and unique within the destination project.
cluster:
  name: ""
  # Optional stable identifier; name alone is sufficient for installation.
  uid: ""

ezgh:
  # Required dataset/environment name: lowercase letters, digits, dots, underscores, hyphens.
  environment: ""
  endpoint: https://obs-ingest.ezghcloud.com

# Create this Secret separately in the release namespace. Never put a token in values.
auth:
  existingSecret: ""
  secretKey: ingest-key

image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.162.0"
  # Optional sha256: digest takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

logs:
  enabled: true
  collectContainerLogs: true
  # A container log's level when the runtime has none: from JSON (level, severity, pino numbers),
  # logfmt level=, klog's I/W/E/F prefix, or a leading INFO/[WARN]/error: word. Otherwise unset.
  parseSeverity: true
  # beginning captures new/short-lived pods; saved offsets take precedence on restart.
  startAt: beginning
  excludeNamespaces: []
  # Additional /var/log/pods glob patterns. This agent's pod is always excluded.
  exclude: []
  # Applied both to physical lines and recombined CRI fragments.
  maxLogSize: 256KiB

metrics:
  enabled: true
  collectKubeletMetrics: true
  collectionInterval: 30s
  kubelet:
    # Literal Collector env substitution, not Helm templating. IPv4 default.
    endpoint: "https://${env:NODE_IP}:10250"
    insecureSkipVerify: false
    # Optional ConfigMap in the release namespace with a custom PEM CA.
    caConfigMap: ""
    caKey: ca.crt
    # Pod specs from the kubelet's /pods: CPU and memory request/limit utilization, and volume
    # types and PVC names on volume metrics. Needs get on nodes/pods, which kubelets accept for
    # /pods from Kubernetes 1.33 (KubeletFineGrainedAuthz). auto: on for 1.33+. Older kubelets
    # need nodes/proxy, which this chart never grants: there, true fails every kubelet scrape.
    podSpecs: auto

traces:
  enabled: true

# A one-replica Deployment for what no node sees alone: cluster state metrics (k8s_cluster: pod
# phase, restarts, readiness, requests and limits, workload replicas, node conditions and
# allocatable, PVCs) when metrics are enabled, and Kubernetes events as logs (events.k8s.io) when
# logs are. Its own ServiceAccount reads those objects cluster-wide (get/list/watch); false
# removes the Deployment and its RBAC.
clusterState:
  enabled: true
  collectionInterval: 30s
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  memoryLimiter:
    limitMiB: 400
    spikeLimitMiB: 100
  nodeSelector: {}
  tolerations: []
  affinity: {}
  priorityClassName: ""

# Pod and workload metadata from the Kubernetes API, for pods on each agent's own node only.
# A workload without a service.name (or with an SDK's unknown_service default) is named after its
# Deployment, StatefulSet, DaemonSet, CronJob or Job. Needs get/list/watch on pods, ReplicaSets
# and Jobs.
kubernetesMetadata:
  enabled: true

otlp:
  # The in-cluster Service's internalTrafficPolicy. Local sends each app's OTLP to the agent on its
  # own node, which then adds the same pod and workload metadata; apps on nodes without an agent
  # can't send. Cluster (the default) lets any agent receive it, and leaves it as sent.
  internalTrafficPolicy: Cluster

export:
  # Per signal, per node. Queue size bounds serialized payload, not total filesystem use.
  queueSizeMiB: 64
  # Per storage database. Allow overhead beyond queue payload size.
  storageMaxMiB: 128
  numConsumers: 2
  timeout: 30s

storage:
  # Release namespace/name are appended to avoid sharing state between releases.
  hostPath: /var/lib/ezgh-obs-agent

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
memoryLimiter:
  # Keep below the container memory limit, with headroom for receiver/export buffers.
  limitMiB: 400
  spikeLimitMiB: 100

# Linux is always selected. These additional selectors can limit node coverage.
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
podAnnotations: {}
terminationGracePeriodSeconds: 60
