name: Release chart
on:
  push:
    tags: ['v*']
  # Publishes an existing release's chart to GHCR (OCI), e.g. one released before OCI publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (v<version>)
        required: true
permissions:
  contents: read
jobs:
  verify:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yaml
  package:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: {bun-version: 1.4.2}
      - uses: azure/setup-helm@v4
        with: {version: v3.17.3}
      - name: Verify tag and package
        run: |
          version=$(bun -e 'console.log(Bun.YAML.parse(await Bun.file("charts/ezgh-obs-agent/Chart.yaml").text()).version)')
          test "$GITHUB_REF_NAME" = "v$version"
          bun run package
          cd dist
          sha256sum *.tgz > SHA256SUMS
      - name: Publish public Helm package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
      - name: Publish OCI chart to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish-oci.sh dist/*.tgz
  backfill-oci:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: azure/setup-helm@v4
        with: {version: v3.17.3}
      - name: Download and verify the release's package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir dist
          gh release download "$TAG" --dir dist --pattern '*.tgz' --pattern SHA256SUMS
          cd dist
          sha256sum --check SHA256SUMS
          test "$(helm show chart ./*.tgz | awk '/^version:/ {print $2}')" = "${TAG#v}"
      - name: Publish OCI chart to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/publish-oci.sh dist/*.tgz
